databases:
  - name: expense-tracker-db
    plan: free

services:
  - type: web
    name: expense-tracker-api
    env: python
    rootDir: expense-tracker/backend
    plan: free
    buildCommand: bash build.sh
    startCommand: gunicorn config.wsgi:application
    healthCheckPath: /api/health/
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: expense-tracker-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: CORS_ALLOWED_ORIGINS
        value: "https://expense-tracker.vercel.app"
      - key: CORS_ALLOWED_ORIGIN_REGEXES
        value: "^https://.*\\.vercel\\.app$"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://expense-tracker.vercel.app"
      - key: ACCESS_TOKEN_MINUTES
        value: "60"
      - key: REFRESH_TOKEN_DAYS
        value: "7"
      - key: SECURE_SSL_REDIRECT
        value: "True"
      - key: SECURE_HSTS_SECONDS
        value: "31536000"
